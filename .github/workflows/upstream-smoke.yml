name: Upstream smoke

# Weekly canary over the live upstreams. A red run must mean "pitstop is broken",
# so nothing the maintainer cannot act on may turn it red. MIMIT failures are
# therefore hard failures; Overpass is a free community endpoint where transient
# 5xx is normal operation, so it is retried and then downgraded to a warning —
# but pitstop's *handling* of that failure is still asserted on every run.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-data:
    name: Live data smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: pip install -e ".[mcp]"

      - name: Check fuel prices
        run: |
          pitstop stations --comune ROMA --fuel Gasolio --cheapest --min-price 1.2 --fresh-within-days 120 --drop-outliers --limit 3 --json > fuel.json
          python - <<'PY'
          import json

          with open("fuel.json", encoding="utf-8") as fh:
              payload = json.load(fh)

          assert payload["count"] > 0, payload
          assert payload["source"].startswith("MIMIT"), payload["source"]
          for station in payload["stations"]:
              assert station["prices"], station
              assert station["prices"][0]["price"] >= 1.2, station
          PY

      - name: Check MIMIT feed freshness
        run: |
          pitstop stations --comune ROMA --fuel Gasolio --limit 1 --json > freshness.json
          python - <<'PY'
          import json
          import re
          from datetime import date, datetime, timezone

          # MIMIT publishes daily at ~06:45 UTC; at this job's pre-dawn hour the
          # extraction date always lags exactly 2 days, weekends and holidays
          # included (measured over nine archived samples, Dec 2025 - Jul 2026).
          # 7 lets a stalled publish or two stay green while a frozen feed still
          # goes red within one weekly run.
          MAX_PRICE_AGE_DAYS = 7

          with open("freshness.json", encoding="utf-8") as fh:
              payload = json.load(fh)

          price_date = payload["price_extraction_date"]
          registry_date = payload["registry_extraction_date"]

          # Both dates come straight off line 0 of the CSV, so a well-formed date
          # here is also the cheapest proof we got the file and not MIMIT's
          # maintenance page (whose line 0 is "<!DOCTYPE html>").
          iso_date = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          for label, value in (("price", price_date), ("registry", registry_date)):
              assert iso_date.match(str(value)), \
                  f"{label}_extraction_date is not a date: {value!r} -- MIMIT served something that is not the CSV"

          today = datetime.now(timezone.utc).date()
          age_days = (today - date.fromisoformat(price_date)).days
          assert age_days <= MAX_PRICE_AGE_DAYS, (
              f"MIMIT price feed looks frozen: price_extraction_date={price_date} "
              f"is {age_days} days old (limit {MAX_PRICE_AGE_DAYS}); the feed normally "
              f"lags 2 days at this hour"
          )
          # A future date means the line was misparsed, not that the feed is fresh;
          # one day of slack absorbs the UTC/CET boundary.
          assert age_days >= -1, f"price_extraction_date={price_date} is in the future (today={today})"

          print(f"price_extraction_date={price_date} ({age_days}d old), "
                f"registry_extraction_date={registry_date}, today={today}")
          PY

      - name: Check MIMIT dataset schema
        run: |
          pitstop stations --limit 0 --json > all.json
          python - <<'PY'
          import collections
          import json
          import statistics

          # Every threshold sits an order of magnitude clear of what the live feed
          # carried on 2026-08-01 (in brackets), so only a layout change that guts
          # the parse can turn this red — not ordinary churn.
          MIN_STATIONS = 10_000        # [23_917]
          MAX_STATIONS = 200_000       # [23_917] -- catches a duplicated/garbage parse
          MIN_PRICED_STATIONS = 5_000  # [21_697]
          MIN_PRICE_ROWS = 20_000      # [93_007]
          MIN_PROVINCE_CODES = 80      # [107 of Italy's 107]
          MIN_IN_BBOX_SHARE = 0.90     # [0.9954]
          MIN_ROWS_PER_MAIN_FUEL = 1_000  # [Benzina 34_267, Gasolio 34_146]
          # Deliberately wide: catches a column shift or a lost decimal, not the
          # market. [Benzina 1.999, Gasolio 2.099, GPL 0.739, Metano 1.599]
          PRICE_BAND = (0.3, 6.0)

          # The four structural MIMIT categories. The other ~55 values are brand
          # names (Blue Diesel, HVOlution, ...) that come and go, so they are
          # counted but not required.
          CORE_FUELS = ("Benzina", "Gasolio", "GPL", "Metano")

          STATION_FIELDS = ("id", "operator", "brand", "type", "name", "address",
                            "comune", "provincia", "lat", "lon", "prices")
          PRICE_FIELDS = ("fuel", "price", "self_service", "updated", "median_basis")

          ITALY_BBOX = (35.0, 47.6, 6.0, 19.0)  # min_lat, max_lat, min_lon, max_lon

          with open("all.json", encoding="utf-8") as fh:
              payload = json.load(fh)

          stations = payload["stations"]
          assert payload["count"] == len(stations), (payload["count"], len(stations))
          assert MIN_STATIONS <= len(stations) <= MAX_STATIONS, (
              f"registry parsed to {len(stations)} stations, outside the plausible "
              f"{MIN_STATIONS}..{MAX_STATIONS} band -- suspect an anagrafica layout change"
          )

          price_rows = 0
          priced_stations = 0
          province_codes = set()
          in_bbox = 0
          by_fuel = collections.defaultdict(list)

          for st in stations:
              missing = [f for f in STATION_FIELDS if f not in st]
              assert not missing, f"station is missing {missing}: {st}"
              prov = str(st["provincia"]).strip()
              # The registry carries some dirty provincia values (full comune names
              # instead of the 2-letter code), so count the well-formed ones rather
              # than requiring every row to be clean.
              if len(prov) == 2 and prov.isalpha():
                  province_codes.add(prov.upper())
              lat, lon = st["lat"], st["lon"]
              if ITALY_BBOX[0] <= lat <= ITALY_BBOX[1] and ITALY_BBOX[2] <= lon <= ITALY_BBOX[3]:
                  in_bbox += 1
              if st["prices"]:
                  priced_stations += 1
              for p in st["prices"]:
                  missing = [f for f in PRICE_FIELDS if f not in p]
                  assert not missing, f"price row is missing {missing}: {p}"
                  assert isinstance(p["price"], (int, float)) and not isinstance(p["price"], bool), p
                  assert isinstance(p["self_service"], bool), p
                  by_fuel[str(p["fuel"]).strip()].append(float(p["price"]))
                  price_rows += 1

          assert priced_stations >= MIN_PRICED_STATIONS, priced_stations
          assert price_rows >= MIN_PRICE_ROWS, price_rows
          assert len(province_codes) >= MIN_PROVINCE_CODES, sorted(province_codes)
          bbox_share = in_bbox / len(stations)
          assert bbox_share >= MIN_IN_BBOX_SHARE, (
              f"only {bbox_share:.2%} of stations sit inside the Italy bbox -- "
              f"suspect the lat/lon columns moved"
          )

          for fuel in CORE_FUELS:
              prices = by_fuel.get(fuel, [])
              assert prices, f"core fuel {fuel!r} vanished from the price feed"
              median = statistics.median(prices)
              assert PRICE_BAND[0] <= median <= PRICE_BAND[1], (
                  f"{fuel} median {median} is outside {PRICE_BAND} -- suspect a "
                  f"column shift or a lost decimal"
              )

          for fuel in ("Benzina", "Gasolio"):
              assert len(by_fuel[fuel]) >= MIN_ROWS_PER_MAIN_FUEL, (fuel, len(by_fuel[fuel]))

          print(f"stations={len(stations)} priced={priced_stations} price_rows={price_rows} "
                f"province_codes={len(province_codes)} in_bbox={bbox_share:.2%} "
                f"distinct_fuels={len(by_fuel)}")
          for fuel in CORE_FUELS:
              print(f"  {fuel}: rows={len(by_fuel[fuel])} median={statistics.median(by_fuel[fuel]):.3f}")
          PY

      - name: Check price statistics
        run: |
          pitstop stats --fuel Gasolio --json > stats.json
          python - <<'PY'
          import json

          with open("stats.json", encoding="utf-8") as fh:
              payload = json.load(fh)

          gasolio = payload["stats"]["Gasolio"]
          assert gasolio["national"]["count"] > 1000, gasolio["national"]
          assert gasolio["national"]["median"] > 1.0, gasolio["national"]
          PY

      - name: Check EV charger discovery
        run: |
          set -uo pipefail

          # Exit 0  -> Overpass answered and the data assertions passed.
          # Exit 75 -> Overpass is degraded but pitstop reported it correctly; retryable.
          # Exit 1  -> pitstop itself is wrong. Never retried, never downgraded.
          cat > check_chargers.py <<'PY'
          import json
          import re
          import sys

          with open("chargers.json", encoding="utf-8") as fh:
              payload = json.load(fh)

          # Holds whether or not Overpass answered.
          assert payload["source"].startswith("OpenStreetMap"), payload["source"]
          assert payload["count"] == len(payload["stations"]), payload

          error = payload.get("error")
          if error:
              # Degraded upstream, but pitstop must still fail honestly: a populated
              # error and no invented data. Hard failure even on a day Overpass is down.
              assert isinstance(error, str) and error.strip(), repr(error)
              # 429 is exempt: rate-limiting is Overpass shedding load, not a bad request.
              assert not re.search(r"HTTP Error 4(?!29)\d\d", error), (
                  f"Overpass rejected the request: {error} -- a 4xx is pitstop asking the "
                  f"wrong question (query syntax, endpoint URL, user agent), not an "
                  f"upstream outage; see src/pitstop/overpass.py"
              )
              if payload["count"] == 0:
                  assert payload["stations"] == [], payload
                  with open("overpass_error.txt", "w", encoding="utf-8") as fh:
                      fh.write(error.strip())
                  print(f"Overpass degraded, no data returned: {error}")
                  sys.exit(75)
              # A timed-out query can still hand back a partial element set; those
              # rows are held to the same assertions as a clean run.
              print(f"Overpass degraded but returned {payload['count']} station(s): {error}")
          else:
              # No error means pitstop is vouching for the result, so hold it to that.
              assert payload["count"] > 0, payload

          for station in payload["stations"]:
              assert station.get("max_power_kw", 0) >= 50, station

          print(f"ok: {payload['count']} fast charger(s)")
          PY

          rc=99
          attempt=0
          # Overpass sheds load with a 504 that clears in under a minute. 0+45+120s
          # of backoff plus three 60s fetch timeouts fits the 15-minute job budget.
          for delay in 0 45 120; do
            attempt=$((attempt + 1))
            if [ "$delay" -gt 0 ]; then
              echo "Retrying in ${delay}s (attempt ${attempt}/3)..."
              sleep "$delay"
            fi
            if ! pitstop chargers --near 46.498,11.354 --radius 8 --fast --limit 5 --json > chargers.json; then
              echo "pitstop chargers exited non-zero -- that is a pitstop failure, not an upstream one"
              exit 1
            fi
            rc=0
            python check_chargers.py || rc=$?
            [ "$rc" -eq 75 ] || break
          done

          if [ "$rc" -eq 75 ]; then
            reason="$(cat overpass_error.txt 2>/dev/null || echo 'unknown')"
            echo "::warning title=Overpass unavailable, EV charger data assertions skipped::Overpass failed ${attempt} attempts (${reason}) — transient 5xx from a free community endpoint, not a pitstop defect. pitstop's failure envelope was verified well-formed (populated error, count 0, no stations); only the charger data assertions were skipped. The MIMIT fuel-price, freshness and schema assertions all ran."
            exit 0
          fi

          exit "$rc"

      - name: Run live agent smoke evals
        run: scripts/run-agent-evals.sh
        env:
          PITSTOP_EVAL_BIN: pitstop
